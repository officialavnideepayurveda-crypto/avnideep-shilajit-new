name: Deploy Main Site to shop.avnideep.in

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'admin-panel/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install Wrangler
        run: npm install -D wrangler@latest

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --config wrangler_new.jsonc

      - name: Deployment Status
        if: success()
        run: |
          echo "✅ Main site deployed successfully!"
          echo "URL: https://shop.avnideep.in"

      - name: Deployment Failed
        if: failure()
        run: echo "❌ Main site deployment failed!"
